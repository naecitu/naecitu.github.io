<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Naecitu · Seven Mixto · Club San Fernando</title>
<meta name="description" content="Torneo de hockey seven mixto en Club San Fernando. Inscripción de equipos, entradas para la fiesta, fixture y resultados.">
<meta property="og:type" content="website">
<meta property="og:title" content="Naecitu · Seven Mixto">
<meta property="og:description" content="Sábado 5 de diciembre · Club San Fernando. Inscribí tu equipo y comprá tus entradas para la fiesta.">
<meta property="og:image" content="https://naecitu.github.io/logo.png">
<meta property="og:url" content="https://naecitu.github.io/">
<meta name="theme-color" content="#173c6f">
<link rel="icon" type="image/png" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --azul:#173c6f; --azul2:#22528f; --verde:#2e8139; --oliva:#92a83a; --salvia:#d5ddbd; --crema:#f4f6ec;
  --tinta:#132238; --gris:#5d6b7c; --linea:#d9dfd0; --blanco:#fff; --rojo:#b3361f; --ambar:#c98a12;
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Barlow',system-ui,sans-serif;background:var(--crema);color:var(--tinta);font-size:16px;line-height:1.45}
h1,h2,h3,.disp{font-family:'Bangers',cursive;letter-spacing:.04em;font-weight:400;color:var(--azul);margin:0}
button,input,select,textarea{font:inherit}
.wrap{max-width:860px;margin:0 auto;padding:0 16px}

/* header */
header{background:var(--azul);color:#fff;position:relative;overflow:hidden}
header::after{content:"";position:absolute;left:-10%;right:-10%;bottom:-38px;height:70px;background:var(--crema);border-radius:50% 50% 0 0}
.hero{display:flex;align-items:center;gap:18px;padding:18px 0 46px;position:relative;z-index:1}
.hero img{width:96px;height:auto;flex:none;filter:drop-shadow(0 4px 10px rgba(0,0,0,.25))}
.hero h1{color:#fff;font-size:44px;line-height:.95}
.hero .sub{color:var(--salvia);font-weight:600;margin-top:4px}
.hero .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);padding:3px 10px;border-radius:999px;font-size:13px;font-weight:600}

/* tabs */
nav{position:sticky;top:0;z-index:5;background:var(--crema);border-bottom:1px solid var(--linea)}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding:8px 0}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:transparent;color:var(--gris);font-weight:700;padding:8px 14px;border-radius:999px;white-space:nowrap;cursor:pointer}
.tab[aria-selected=true]{background:var(--azul);color:#fff}
.tab.cta{color:var(--verde)}
.tab.cta[aria-selected=true]{background:var(--verde);color:#fff}

main{padding:18px 0 60px}
section[hidden]{display:none}
.card{background:var(--blanco);border:1px solid var(--linea);border-radius:var(--r);padding:16px;margin-bottom:14px}
.card h2{font-size:26px;margin-bottom:8px}
.card h3{font-size:20px;margin-bottom:6px}
.muted{color:var(--gris)}
.small{font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1 1 180px}
.btn{border:0;border-radius:10px;background:var(--azul);color:#fff;font-weight:700;padding:10px 16px;cursor:pointer}
.btn:hover{background:var(--azul2)}
.btn.verde{background:var(--verde)}
.btn.ghost{background:transparent;color:var(--azul);border:1.5px solid var(--azul)}
.btn.sm{padding:6px 10px;font-size:14px}
.btn.rojo{background:var(--rojo)}
.btn:disabled{opacity:.5;cursor:default}

/* pago */
.pago{background:linear-gradient(135deg,var(--verde),#3d9a49);color:#fff;border:0}
.pago h2{color:#fff}
.pago .alias{font-family:'Bangers';font-size:30px;letter-spacing:.06em;word-break:break-all}
.pago .monto{font-size:22px;font-weight:700}
.pago .cvu{font-weight:700;font-size:16px;letter-spacing:.03em;word-break:break-all}
.pago .btn{background:#fff;color:var(--verde)}

/* avisos */
.aviso{border-left:4px solid var(--oliva)}
.aviso.fijo{border-left-color:var(--azul)}
.aviso .fecha{font-size:13px;color:var(--gris)}
.aviso p{margin:6px 0 0;white-space:pre-wrap}

/* form */
label{display:block;font-weight:600;font-size:14px;margin:10px 0 4px}
input[type=text],input[type=tel],input[type=email],input[type=number],input[type=time],input[type=date],input[type=password],select,textarea{
  width:100%;padding:10px 12px;border:1.5px solid var(--linea);border-radius:10px;background:#fff;color:var(--tinta)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--azul)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
@media(max-width:560px){.grid2{grid-template-columns:1fr}}
.jug{display:grid;grid-template-columns:28px 1fr 92px 32px;gap:8px;align-items:center;margin-bottom:6px}
.jug .n{color:var(--gris);font-weight:700;text-align:right}
.sexo{display:flex;border:1.5px solid var(--linea);border-radius:10px;overflow:hidden}
.sexo button{flex:1;border:0;background:#fff;padding:9px 0;font-weight:700;color:var(--gris);cursor:pointer}
.sexo button.on.F{background:var(--oliva);color:#fff}
.sexo button.on.M{background:var(--azul);color:#fff}
.x{border:0;background:transparent;color:var(--gris);font-size:20px;cursor:pointer}
.contador{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.contador span{font-size:13px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--salvia)}
.contador span.ok{background:#dcefd9;color:var(--verde)}
.contador span.mal{background:#f6dfd9;color:var(--rojo)}
.msg{padding:12px 14px;border-radius:10px;font-weight:600;margin-top:12px}
.msg.ok{background:#dcefd9;color:#1d5a26}
.msg.err{background:#f6dfd9;color:var(--rojo)}
.check{display:flex;gap:8px;align-items:flex-start;font-weight:500;margin-top:12px}

/* tablas */
table{width:100%;border-collapse:collapse;font-size:15px}
th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--gris);text-align:center;padding:6px 4px;border-bottom:2px solid var(--linea)}
th:nth-child(2),td:nth-child(2){text-align:left}
td{padding:8px 4px;text-align:center;border-bottom:1px solid var(--linea);font-variant-numeric:tabular-nums}
tr.clasif td:first-child{color:var(--verde);font-weight:700}
td.pts{font-weight:700;color:var(--azul)}
.scroll{overflow-x:auto}

/* fixture */
.turno{margin-bottom:12px}
.turno-h{display:flex;align-items:baseline;gap:10px;margin:14px 0 6px}
.turno-h .hora{font-family:'Bangers';font-size:24px;color:var(--azul);letter-spacing:.05em}
.turno-h .fase{font-size:13px;font-weight:700;color:var(--gris);text-transform:uppercase;letter-spacing:.05em}
.partido{display:grid;grid-template-columns:62px 1fr auto 1fr;gap:8px;align-items:center;background:#fff;border:1px solid var(--linea);border-radius:12px;padding:10px 12px;margin-bottom:6px}
.partido .cancha{font-size:12px;font-weight:700;color:var(--gris);text-transform:uppercase;line-height:1.1}
.partido .cancha b{display:block;font-size:11px;color:var(--oliva)}
.partido .eq{font-weight:700}
.partido .eq.v{text-align:right}
.partido .eq.lab{color:var(--gris);font-weight:500;font-style:italic}
.partido .eq.gana{color:var(--verde)}
.partido .res{font-family:'Bangers';font-size:22px;color:var(--azul);min-width:64px;text-align:center;letter-spacing:.05em}
.partido .res.vs{font-family:'Barlow';font-size:13px;color:var(--gris);font-weight:700}
.partido .pen{display:block;font-family:'Barlow';font-size:11px;color:var(--gris)}
.partido.mio{border-color:var(--oliva);box-shadow:0 0 0 2px var(--salvia)}
@media(max-width:480px){.partido{grid-template-columns:44px 1fr auto 1fr;padding:8px}.partido .res{min-width:52px}}
.vacio{text-align:center;padding:34px 16px;color:var(--gris)}
.vacio .disp{font-size:26px;color:var(--oliva);display:block;margin-bottom:4px}

/* equipos */
.eqlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.eqcard{background:#fff;border:1px solid var(--linea);border-radius:12px;padding:12px}
.eqcard .nom{font-weight:700;font-size:17px}
.estado{font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;text-transform:uppercase;letter-spacing:.04em}
.estado.confirmado{background:#dcefd9;color:var(--verde)}
.estado.pendiente{background:#fbecd0;color:#8a5d06}
.estado.espera{background:#e4e8ef;color:var(--gris)}
.estado.baja{background:#f6dfd9;color:var(--rojo)}

/* admin */
.adm-eq{border:1px solid var(--linea);border-radius:12px;padding:12px;margin-bottom:8px;background:#fff}
.adm-eq summary{cursor:pointer;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-weight:700;list-style:none}
.adm-eq summary::-webkit-details-marker{display:none}
.adm-res{display:grid;grid-template-columns:1fr 54px 54px 1fr;gap:6px;align-items:center}
.adm-res input{text-align:center;padding:8px 4px}
.adm-pen{display:grid;grid-template-columns:1fr 54px 54px 1fr;gap:6px;margin-top:4px}
.adm-pen input{text-align:center;padding:4px;font-size:13px}
.calc td,.calc th{text-align:center}
.sub-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.sub-tabs button{border:1.5px solid var(--linea);background:#fff;border-radius:999px;padding:6px 12px;font-weight:700;color:var(--gris);cursor:pointer}
.sub-tabs button.on{border-color:var(--azul);color:var(--azul)}
.loader{text-align:center;padding:50px;color:var(--gris)}
.jug2{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px;border:1px solid var(--linea);border-radius:12px;margin-bottom:6px;background:#fff}
.jug2 .n{width:20px;color:var(--gris);font-weight:700;text-align:right}
.jug2 input.nm{flex:1 1 130px;width:auto}
.jug2 input.dn{flex:1 1 110px;width:auto}
.jug2 .sexo{width:84px}
.fiesta-chk{display:flex;align-items:center;gap:4px;margin:0;font-size:18px;cursor:pointer;padding:4px 6px;border:1.5px solid var(--linea);border-radius:10px}
.fiesta-chk input{width:18px;height:18px}
.tandas{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.tanda{border:1.5px solid var(--linea);border-radius:12px;padding:10px 12px;background:#fff;color:var(--tinta)}
.tanda .tn{font-weight:700;font-size:14px;color:var(--gris)}
.tanda .tp{font-family:'Bangers';font-size:26px;color:var(--azul);letter-spacing:.04em}
.tanda .tl{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--gris)}
.tanda.activa{border-color:var(--verde);box-shadow:0 0 0 2px #dcefd9}
.tanda.activa .tl{color:var(--verde)}
.tanda.agotada{opacity:.55}
.tanda.agotada .tp{text-decoration:line-through}
.fiesta{background:linear-gradient(135deg,#173c6f,#2a1f5c);color:#fff;border:0}
.fiesta h2{color:#fff}
.tedit{display:grid;grid-template-columns:1fr 110px 80px 32px;gap:6px;align-items:center;margin-bottom:6px}
.tedit input{padding:8px}
.puerta .pt{font-family:'Bangers';font-size:28px;letter-spacing:.04em}
.prow{padding:6px 0;border-bottom:1px solid var(--linea)}
.prow.in{opacity:.55}
.comp{font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:#e4eefb;color:var(--azul);text-decoration:none}
.comp.no{background:#f6dfd9;color:var(--rojo)}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--tinta);color:#fff;padding:10px 16px;border-radius:10px;font-weight:600;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
</style>
</head>

<script>
/* ============ Estado ============ */
var D = null;            // datos públicos
var A = null;            // datos admin
var PIN = null;
var PINR = null;          // contraseña de Carga de resultados
var TAB = 'inicio';
var miEquipo = '';
var adminSub = 'equipos';
var jugadores = [];
var comprobante = null;

var $ = function(s, el){ return (el||document).querySelector(s); };
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function toast(t){ var el=$('#toast'); el.textContent=t; el.classList.add('on'); clearTimeout(el._t); el._t=setTimeout(function(){el.classList.remove('on');},Math.max(2200, t.length*70)); }
var API_URL = 'https://script.google.com/macros/s/AKfycbxhh6g4qY6SVkfg4-lOBSAYbQgvY8mUP0KpwPd5Eptkh2lD_yqJS7GT5kToO_oBzREMhQ/exec';
function api(fn){
  var args = Array.prototype.slice.call(arguments,1);
  if(!(window.google && google.script && google.script.run)){
    // Página fuera de Google (GitHub Pages): llama a la API por fetch
    return fetch(API_URL, { method:'POST', redirect:'follow', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({fn:fn, args:args}) })
      .then(function(r){ if(!r.ok) throw new Error('No se pudo conectar ('+r.status+'). Probá de nuevo.'); return r.json(); })
      .then(function(j){ if(!j.ok) throw new Error(j.error || 'Error'); return j.data; });
  }
  return new Promise(function(ok, ko){
    var r = google.script.run.withSuccessHandler(ok).withFailureHandler(function(e){ ko(e && e.message ? e : new Error(String(e))); });
    r[fn].apply(r, args);
  });
}
function cfg(k){ return (D && D.config && D.config[k]) || ''; }
function nombreEq(id){ var e = (A&&A.equiposFull||D.equipos).filter(function(x){return x.id===id;})[0]; return e ? e.nombre : ''; }
function fmtMonto(m){ var n = Number(String(m).replace(/[^\d.]/g,'')); return n ? '$ ' + n.toLocaleString('es-AR') : esc(m); }
function fmtFecha(f){ if(!f) return ''; var d = new Date(f + 'T12:00:00'); if(isNaN(d)) return esc(f); return d.toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long'}); }
try { miEquipo = localStorage.getItem('naecitu-mi-equipo') || ''; } catch(e){}

/* ============ Tabs ============ */
$('#tabs').addEventListener('click', function(e){
  var b = e.target.closest('.tab'); if(!b) return;
  irA(b.dataset.t);
});
function irA(t){
  TAB = t;
  document.querySelectorAll('.tab').forEach(function(b){ b.setAttribute('aria-selected', b.dataset.t===t); });
  document.querySelectorAll('main section').forEach(function(s){ s.hidden = s.id !== 's-'+t; });
  render();
  window.scrollTo({top:0});
}

/* ============ Carga ============ */
function cargar(){
  return api('getPublicData').then(function(d){ D = d; $('#loader').remove(); pintarHeader(); irA(TAB); })
    .catch(function(e){ $('#loader').textContent = 'No se pudo cargar: ' + e.message; });
}
function aplicarAdmin(d){ A = d; D = d; pintarHeader(); render(); }
function pintarHeader(){
  $('#h-sede').textContent = cfg('sede');
  var m = [];
  if(cfg('fecha')) m.push('📅 ' + fmtFecha(cfg('fecha')));
  m.push('⏰ ' + esc(cfg('horaInicio')) + ' h');
  m.push('🏑 ' + ((D.conteo&&D.conteo.inscriptos)||0) + ' / ' + esc(cfg('cupo')) + ' equipos');
  $('#h-meta').innerHTML = m.map(function(x){ return '<span class="chip">'+x+'</span>'; }).join('');
}
function render(){
  if(!D) return;
  ({inicio:rInicio, inscripcion:rInscripcion, fiesta:rFiesta, equipos:rEquipos, fixture:rFixture, posiciones:rPosiciones, carga:rCarga, admin:rAdmin})[TAB]();
}

/* ============ Inicio ============ */
function mdLite(t){
  var out = [], lista = false;
  String(t||'').split('\n').forEach(function(l){
    var s = l.trim(), li = /^[-•]\s+/.test(s);
    if(lista && !li){ out.push('</ul>'); lista = false; }
    if(!s) return;
    var h = esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
    if(/^#{1,3}\s/.test(s)) out.push('<h3 style="margin:16px 0 4px">'+h.replace(/^#{1,3}\s/,'')+'</h3>');
    else if(li){ if(!lista){ out.push('<ul style="margin:4px 0 8px;padding-left:20px">'); lista = true; } out.push('<li style="margin:3px 0">'+h.replace(/^[-•]\s+/,'')+'</li>'); }
    else out.push('<p style="margin:6px 0">'+h+'</p>');
  });
  if(lista) out.push('</ul>');
  return out.join('');
}
function infoTorneo(){ return cfg('reglamento') ? '<div class="card"><h2>El torneo</h2>'+mdLite(cfg('reglamento'))+'</div>' : ''; }
function bloquePago(){
  if(!cfg('alias') && !cfg('monto')) return '';
  return '<div class="card pago"><h2>Inscripción</h2>'
    + (cfg('monto') ? '<div class="monto">'+fmtMonto(cfg('monto'))+' por equipo</div>' : '')
    + (cfg('alias') ? '<div class="small" style="margin-top:8px;opacity:.85">Alias</div><div class="row"><div class="alias grow">'+esc(cfg('alias'))+'</div><button class="btn sm" onclick="copiarAlias()">Copiar alias</button></div>' : '')
    + (cfg('cvu') ? '<div class="small" style="margin-top:8px;opacity:.85">CVU</div><div class="row"><div class="cvu grow">'+esc(cfg('cvu'))+'</div><button type="button" class="btn sm" onclick="copiarTexto(cfg(\'cvu\'),\'CVU copiado\')">Copiar CVU</button></div>' : '')
    + (cfg('titular') ? '<div class="small">Titular: '+esc(cfg('titular'))+'</div>' : '')
    + (cfg('infoPago') ? '<p class="small" style="margin:10px 0 0">'+esc(cfg('infoPago'))+'</p>' : '')
    + '</div>';
}
function copiarTexto(t, ok){ (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(function(){ toast(ok); }).catch(function(){ prompt('Copiá:', t); }); }
function copiarAlias(){
  var a = cfg('alias');
  (navigator.clipboard ? navigator.clipboard.writeText(a) : Promise.reject()).then(function(){ toast('Alias copiado'); })
    .catch(function(){ prompt('Copiá el alias:', a); });
}
function rInicio(){
  var avisos = D.avisos.length ? D.avisos.map(function(a){
    return '<div class="card aviso'+(a.fijado===true||a.fijado==='TRUE'?' fijo':'')+'"><h3>'+(a.fijado===true||a.fijado==='TRUE'?'📌 ':'')+esc(a.titulo)+'</h3><div class="fecha">'+esc(a.fecha)+'</div><p>'+esc(a.texto)+'</p></div>';
  }).join('') : '<div class="card vacio"><span class="disp">Sin novedades</span>Acá vamos a publicar horarios, cambios y resultados.</div>';
  var abierta = cfg('inscripcionAbierta') === 'si';
  $('#s-inicio').innerHTML =
    (abierta ? '<div class="card row" style="justify-content:space-between"><div><h2 style="margin:0">Inscripción abierta</h2><div class="muted small">Equipos mixtos · desde '+esc(cfg('minJugadores'))+' jugadores, sin límite</div></div><button class="btn verde" onclick="irA(\'inscripcion\')">Anotar equipo</button></div>'
             : '<div class="card"><h2 style="margin:0">Inscripción cerrada</h2></div>')
    + infoTorneo()
    + '<h2 style="margin:18px 0 10px">Avisos</h2>' + avisos
    + (cfg('contacto') ? '<div class="card"><h3>Contacto</h3><p style="margin:0;white-space:pre-wrap">'+esc(cfg('contacto'))+'</p></div>' : '')
    + bloquePago();
}

/* ============ Inscripción ============ */
function rInscripcion(){
  var s = $('#s-inscripcion');
  if(cfg('inscripcionAbierta') !== 'si'){ s.innerHTML = '<div class="card vacio"><span class="disp">Inscripción cerrada</span>Consultá con la organización.</div>'; return; }
  if(s.dataset.ok) return;
  var min = +cfg('minJugadores') || 7;
  if(!jugadores.length) for(var i=0;i<min;i++) jugadores.push({nombre:'',apellido:'',dni:'',sexo:'',fiesta:i<(+cfg('entradasEquipo')||7)});
  var ocupados = (D.conteo&&D.conteo.inscriptos)||0;
  var lleno = ocupados >= +cfg('cupo');
  s.innerHTML =
    infoTorneo()
    + (lleno ? '<div class="msg err">El cupo está completo. Si te anotás quedás en lista de espera.</div>' : '')
    + '<form class="card" id="f-ins" novalidate>'
    + '<h2>Datos del equipo</h2>'
    + '<div class="grid2"><div><label for="i-nombre">Nombre del equipo *</label><input type="text" id="i-nombre" maxlength="40" required></div>'
    + '<div><label for="i-club">Club / grupo</label><input type="text" id="i-club" maxlength="60"></div></div>'
    + '<div class="grid2"><div><label for="i-cap">Capitán/a *</label><input type="text" id="i-cap" maxlength="60" required></div>'
    + '<div><label for="i-tel">WhatsApp *</label><input type="tel" id="i-tel" maxlength="30" placeholder="11 1234-5678" required></div></div>'
    + '<label for="i-mail">Email * <span class="muted" style="font-weight:400">(ahí llega la confirmación)</span></label><input type="email" id="i-mail" maxlength="80" required>'
    + '<h2 style="margin-top:18px">Plantel</h2><div class="muted small">Mínimo '+esc(cfg('minMujeres'))+' mujeres y '+esc(cfg('minVarones'))+' varones · desde '+min+' jugadores, sin límite</div>'
    + '<div class="muted small" style="margin-top:4px">Marcá con 🎉 a quienes usan las '+esc(cfg('entradasEquipo')||7)+' entradas a la fiesta incluidas. <b>Para entrar a la fiesta se escanea el DNI</b>, así que cargalo bien.</div>'
    + '<div class="contador" id="i-cont"></div><div id="i-jug"></div>'
    + '<button type="button" class="btn ghost sm" id="i-add">+ Agregar jugador/a</button>'
    + '<div style="margin-top:18px">' + bloquePago() + '</div>'
    + '<h2 style="margin-top:18px">Comprobante de pago</h2>'
    + '<div class="muted small">Imagen o PDF, hasta 5 MB. Si todavía no pagaste, podés mandarlo después por WhatsApp.</div>'
    + '<input type="file" id="i-comp" accept="image/*,application/pdf" style="margin-top:8px">'
    + '<label class="check"><input type="checkbox" id="i-ok"> <span>Entiendo que la inscripción es un monto fijo por equipo que incluye 7 entradas a la fiesta (las entradas adicionales se pagan aparte) y que el equipo queda inscripto recién cuando la organización valida el pago.</span></label>'
    + '<button class="btn verde" style="width:100%;margin-top:16px;padding:14px" id="i-send">Enviar inscripción</button>'
    + '<div id="i-msg"></div></form>';
  pintarJugadores();
  $('#i-add').onclick = function(){ if(jugadores.length < +cfg('maxJugadores')){ jugadores.push({nombre:'',apellido:'',dni:'',sexo:'',fiesta:false}); pintarJugadores(); } };
  $('#i-comp').onchange = leerComprobante;
  $('#f-ins').onsubmit = enviarInscripcion;
}
function pintarJugadores(){
  var maxF = +cfg('entradasEquipo') || 7;
  $('#i-jug').innerHTML = jugadores.map(function(j,i){
    return '<div class="jug2"><span class="n">'+(i+1)+'</span>'
      + '<input type="text" class="nm" placeholder="Nombre" value="'+esc(j.nombre)+'" data-i="'+i+'" data-k="nombre" maxlength="40" aria-label="Nombre jugador '+(i+1)+'">'
      + '<input type="text" class="nm" placeholder="Apellido" value="'+esc(j.apellido)+'" data-i="'+i+'" data-k="apellido" maxlength="40" aria-label="Apellido jugador '+(i+1)+'">'
      + '<input type="text" class="dn" inputmode="numeric" placeholder="DNI" value="'+esc(j.dni)+'" data-i="'+i+'" data-k="dni" maxlength="12" aria-label="DNI jugador '+(i+1)+'">'
      + '<div class="sexo"><button type="button" class="F'+(j.sexo==='F'?' on':'')+'" data-i="'+i+'" data-s="F" aria-label="Mujer">M</button><button type="button" class="M'+(j.sexo==='M'?' on':'')+'" data-i="'+i+'" data-s="M" aria-label="Varón">V</button></div>'
      + '<label class="fiesta-chk" title="Usa una de las entradas a la fiesta"><input type="checkbox" data-f="'+i+'"'+(j.fiesta?' checked':'')+' aria-label="Entrada a la fiesta jugador '+(i+1)+'">🎉</label>'
      + '<button type="button" class="x" data-del="'+i+'" aria-label="Quitar">×</button></div>';
  }).join('');
  $('#i-jug').querySelectorAll('input[data-k]').forEach(function(el){ el.oninput = function(){ jugadores[+el.dataset.i][el.dataset.k] = el.value; contar(); }; });
  $('#i-jug').querySelectorAll('input[data-f]').forEach(function(el){ el.onchange = function(){
    var usadas = jugadores.filter(function(j){return j.fiesta;}).length;
    if(el.checked && usadas >= maxF){ el.checked = false; toast('La inscripción incluye '+maxF+' entradas. Las demás se compran en la pestaña Fiesta.'); return; }
    jugadores[+el.dataset.f].fiesta = el.checked; contar();
  }; });
  $('#i-jug').querySelectorAll('.sexo button').forEach(function(b){ b.onclick = function(){ jugadores[+b.dataset.i].sexo = b.dataset.s; pintarJugadores(); }; });
  $('#i-jug').querySelectorAll('[data-del]').forEach(function(b){ b.onclick = function(){ jugadores.splice(+b.dataset.del,1); pintarJugadores(); }; });
  $('#i-add').disabled = jugadores.length >= +cfg('maxJugadores');
  contar();
}
function contar(){
  var v = jugadores.filter(function(j){return (j.nombre+j.apellido+j.dni).trim();});
  var f = v.filter(function(j){return j.sexo==='F';}).length, m = v.filter(function(j){return j.sexo==='M';}).length;
  var cl = function(ok){ return ok ? 'ok' : 'mal'; };
  $('#i-cont').innerHTML = '<span class="'+cl(v.length>=+cfg('minJugadores'))+'">'+v.length+' jugadores</span>'
    + '<span class="'+cl(f>=+cfg('minMujeres'))+'">'+f+' mujeres</span><span class="'+cl(m>=+cfg('minVarones'))+'">'+m+' varones</span>'
    + '<span class="ok">🎉 '+jugadores.filter(function(j){return j.fiesta;}).length+' / '+(+cfg('entradasEquipo')||7)+' entradas a la fiesta</span>';
}
function leerComprobante(e){
  var file = e.target.files[0]; comprobante = null;
  if(!file) return;
  if(file.size > 5*1024*1024){ toast('El archivo supera 5 MB'); e.target.value=''; return; }
  var r = new FileReader();
  r.onload = function(){ comprobante = { nombre:file.name, tipo:file.type || 'application/octet-stream', data:String(r.result).split(',')[1] }; };
  r.readAsDataURL(file);
}
function enviarInscripcion(ev){
  ev.preventDefault();
  var msg = $('#i-msg'); msg.innerHTML = '';
  var err = function(t){ msg.innerHTML = '<div class="msg err">'+esc(t)+'</div>'; };
  var lleno = jugadores.filter(function(j){return (j.nombre+j.apellido+j.dni).trim();});
  if(!$('#i-nombre').value.trim()) return err('Falta el nombre del equipo.');
  if(!$('#i-cap').value.trim() || !$('#i-tel').value.trim()) return err('Faltan nombre y WhatsApp del capitán/a.');
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test($('#i-mail').value.trim())) return err('Ingresá un email válido: ahí te llega la confirmación.');
  if(lleno.some(function(j){return !j.nombre.trim() || !j.apellido.trim();})) return err('Completá nombre y apellido de cada jugador/a.');
  if(lleno.some(function(j){return !dniOk(j.dni);})) return err('Revisá los DNI: solo números, 7 u 8 dígitos.');
  if(lleno.some(function(j){return !j.sexo;})) return err('Marcá M (mujer) o V (varón) para cada jugador/a.');
  if(!$('#i-ok').checked) return err('Tenés que aceptar la confirmación.');
  var b = $('#i-send'); b.disabled = true; b.textContent = 'Enviando…';
  api('inscribir', {
    nombre: $('#i-nombre').value, club: $('#i-club').value, capitan: $('#i-cap').value,
    telefono: $('#i-tel').value, email: $('#i-mail').value, jugadores: lleno, comprobante: comprobante
  }).then(function(r){
    var s = $('#s-inscripcion'); s.dataset.ok = '1';
    jugadores = []; comprobante = null;
    s.innerHTML = '<div class="card"><h2>¡Listo, '+esc($('#i-nombre').value)+'!</h2>'
      + (r.espera ? '<p>El cupo estaba completo: quedaron <b>en lista de espera</b>. Te avisamos si se libera un lugar.</p>'
                  : '<p>La inscripción quedó <b>pendiente</b> hasta que validemos el pago. Cuando la confirmemos te llega un mail.</p>')
      + (r.comprobante ? '<p class="muted">Recibimos el comprobante.</p>' : '<p>Acordate de transferir y mandar el comprobante.</p>')
      + '</div>' + bloquePago()
      + '<button class="btn ghost" onclick="var s=document.getElementById(\'s-inscripcion\');delete s.dataset.ok;rInscripcion()">Inscribir otro equipo</button>';
    return api('getPublicData').then(function(d){ D = d; pintarHeader(); });
  }).catch(function(e){ err(e.message.replace(/^Error:\s*/,'')); b.disabled = false; b.textContent = 'Enviar inscripción'; });
}

/* ============ Fiesta ============ */
var compraEnt = null, asistentes = [{nombre:'',apellido:'',dni:''}], cantEnt = 1;
function fmtPesos(n){ return '$ ' + Number(n||0).toLocaleString('es-AR'); }
function nombreC(j){ return ((j.nombre||'')+' '+(j.apellido||'')).trim(); }
function dniOk(d){ d = String(d||'').replace(/\D/g,''); return d.length>=6 && d.length<=9; }
function aliasHtml(){
  return (cfg('alias') ? '<div class="small" style="margin-top:8px;opacity:.85">Alias</div><div class="row"><div class="alias grow">'+esc(cfg('alias'))+'</div><button type="button" class="btn sm" onclick="copiarAlias()">Copiar alias</button></div>' : '<p class="small">El alias se publica en breve.</p>')
    + (cfg('cvu') ? '<div class="small" style="margin-top:8px;opacity:.85">CVU</div><div class="row"><div class="cvu grow">'+esc(cfg('cvu'))+'</div><button type="button" class="btn sm" onclick="copiarTexto(cfg(\'cvu\'),\'CVU copiado\')">Copiar CVU</button></div>' : '')
    + (cfg('titular') ? '<div class="small">Titular: '+esc(cfg('titular'))+'</div>' : '');
}
function tandasHtml(F){
  return '<div class="tandas">' + (F.tandas||[]).map(function(t,i){
    var st = i===F.activa ? 'activa' : (t.quedan<=0 ? 'agotada' : 'proxima');
    var lab = st==='activa' ? 'A la venta · quedan '+t.quedan : st==='agotada' ? 'Agotada' : 'Próximamente';
    return '<div class="tanda '+st+'"><div class="tn">'+esc(t.nombre)+'</div><div class="tp">'+(t.precio==null?'$ xx.xxx':fmtPesos(t.precio))+'</div><div class="tl">'+lab+'</div></div>';
  }).join('') + '</div>';
}
function rFiesta(){
  var s = $('#s-fiesta');
  if(s.dataset.ok) return;
  var F = D.fiesta || {tandas:[], activa:-1, abierta:false, maxPorCompra:10};
  var head = '<div class="card fiesta"><h2>Fiesta · Barra libre</h2>'

/* ============ Fixture ============ */
function etiqueta(p, lado){
  var id = lado==='L' ? p.local : p.visitante;
  if(id) return {t:nombreEq(id) || id, lab:false};
  return {t:(lado==='L'?p.etiquetaL:p.etiquetaV) || 'A definir', lab:true};
}
function ganador(p){
  if(p.gl===''||p.gv===''||p.gl==null) return null;
  var gl=+p.gl, gv=+p.gv;
  if(gl!==gv) return gl>gv ? 'L' : 'V';
  if(p.pl!==''&&p.pv!==''&&p.pl!=null&&+p.pl!==+p.pv) return +p.pl>+p.pv ? 'L' : 'V';
  return 'E';
}
function htmlPartido(p){
  var L = etiqueta(p,'L'), V = etiqueta(p,'V'), g = ganador(p);
  var jugado = p.gl!=='' && p.gl!=null;
  var mio = miEquipo && (p.local===miEquipo || p.visitante===miEquipo);
  var pen = (jugado && p.pl!=='' && p.pl!=null) ? '<span class="pen">pen. '+p.pl+'-'+p.pv+'</span>' : '';
  return '<div class="partido'+(mio?' mio':'')+'"><div class="cancha">Cancha '+esc(p.cancha)+'<b>'+esc(p.zona||p.fase)+'</b></div>'
    + '<div class="eq'+(L.lab?' lab':'')+(g==='L'?' gana':'')+'">'+esc(L.t)+'</div>'
    + (jugado ? '<div class="res">'+p.gl+' - '+p.gv+pen+'</div>' : '<div class="res vs">vs</div>')
    + '<div class="eq v'+(V.lab?' lab':'')+(g==='V'?' gana':'')+'">'+esc(V.t)+'</div></div>';
}
function agruparTurnos(ps){
  var t = {};
  ps.forEach(function(p){ (t[p.turno] = t[p.turno] || []).push(p); });
  return Object.keys(t).sort(function(a,b){return a-b;}).map(function(k){ return t[k].sort(function(a,b){return a.cancha-b.cancha;}); });
}

/* ============ Posiciones ============ */
function tablas(){
  var zonas = {};
  D.partidos.filter(function(p){return p.fase==='Zona';}).forEach(function(p){
    var z = zonas[p.zona] = zonas[p.zona] || {};
    [p.local,p.visitante].forEach(function(id){ if(id && !z[id]) z[id] = {id:id,pj:0,g:0,e:0,p:0,gf:0,gc:0,pts:0}; });
    if(p.gl===''||p.gl==null||p.gv===''||p.gv==null) return;
    var a = z[p.local], b = z[p.visitante], gl=+p.gl, gv=+p.gv;
    a.pj++; b.pj++; a.gf+=gl; a.gc+=gv; b.gf+=gv; b.gc+=gl;
    if(gl>gv){a.g++;b.p++;a.pts+=3;} else if(gl<gv){b.g++;a.p++;b.pts+=3;} else {a.e++;b.e++;a.pts++;b.pts++;}
  });
  var out = {};
  Object.keys(zonas).sort().forEach(function(z){
    out[z] = Object.keys(zonas[z]).map(function(k){return zonas[z][k];}).sort(function(a,b){
      return b.pts-a.pts || (b.gf-b.gc)-(a.gf-a.gc) || b.gf-a.gf || nombreEq(a.id).localeCompare(nombreEq(b.id));
    });
  });
  return out;
}
function clasificanPorZona(){
  var po = D.partidos.filter(function(p){return p.fase!=='Zona';});
  var max = {};
  po.forEach(function(p){ [p.etiquetaL,p.etiquetaV].forEach(function(l){ var m = /^(\d+)° (.+)$/.exec(l||''); if(m) max[m[2]] = Math.max(max[m[2]]||0, +m[1]); }); });
  return max;
}
function rPosiciones(){
  var s = $('#s-posiciones');
  var T = tablas(), zs = Object.keys(T);
  if(!zs.length){ s.innerHTML = '<div class="card vacio"><span class="disp">Sin partidos</span>Las tablas aparecen cuando se publique el fixture.</div>'; return; }
  var cz = clasificanPorZona();
  var po = D.partidos.filter(function(p){return p.fase!=='Zona';});
  s.innerHTML = zs.map(function(z){
    return '<div class="card"><h2>'+esc(z)+'</h2><div class="scroll"><table><thead><tr><th>#</th><th>Equipo</th><th>PJ</th><th>G</th><th>E</th><th>P</th><th>GF</th><th>GC</th><th>DG</th><th>Pts</th></tr></thead><tbody>'
      + T[z].map(function(r,i){ return '<tr class="'+(i < (cz[z]||0) ? 'clasif' : '')+'"><td>'+(i+1)+'</td><td>'+esc(nombreEq(r.id))+'</td><td>'+r.pj+'</td><td>'+r.g+'</td><td>'+r.e+'</td><td>'+r.p+'</td><td>'+r.gf+'</td><td>'+r.gc+'</td><td>'+(r.gf-r.gc)+'</td><td class="pts">'+r.pts+'</td></tr>'; }).join('')
      + '</tbody></table></div></div>';
  }).join('')
  + (po.length ? '<div class="card"><h2>Definición</h2>' + po.map(htmlPartido).join('') + '</div>' : '')

/* ============ Resolver cruces (admin) ============ */
function resolverEtiqueta(l, T){
  if(!l) return '';
  var m = /^(\d+)° (.+)$/.exec(l);
  if(m){ var r = (T[m[2]]||[])[+m[1]-1]; return r ? r.id : ''; }
  m = /^Mejor (\d+)° #(\d+)$/.exec(l);
  if(m){
    var pos = +m[1]-1;
    var cand = Object.keys(T).map(function(z){ var r=T[z][pos]; return r ? {id:r.id, ppp:r.pj?r.pts/r.pj:0, dg:r.pj?(r.gf-r.gc)/r.pj:0, gf:r.pj?r.gf/r.pj:0} : null; }).filter(Boolean)
      .sort(function(a,b){ return b.ppp-a.ppp || b.dg-a.dg || b.gf-a.gf; });
    return cand[+m[2]-1] ? cand[+m[2]-1].id : '';
  }
  m = /^(Ganador|Perdedor) (P\d+)$/.exec(l);
  if(m){
    var p = D.partidos.filter(function(x){return x.id===m[2];})[0]; if(!p) return '';
    var g = ganador(p); if(!g || g==='E') return '';
    var gan = g==='L' ? p.local : p.visitante, per = g==='L' ? p.visitante : p.local;
    return m[1]==='Ganador' ? gan : per;
  }
  return '';
}

/* --- Calculadora: replica el motor del servidor --- */
function zonasDe(n, formato, tam){
  if(formato==='todos') return [n];
  var k = Math.max(1, Math.round(n/tam)), base = Math.floor(n/k), resto = n%k;
  return Array.from({length:k}, function(_,i){ return base + (i<resto?1:0); });
}
function calcular(n, formato, tam, Q){
  var zs = zonasDe(n, formato, tam);
  var grupos = zs.reduce(function(s,z){ return s + z*(z-1)/2; }, 0);
  var po = Q>=8 ? 8 : Q>=4 ? 4 : Q>=2 ? 1 : 0;
  var canchas = +cfg('canchas') || 2;
  var porTurnoGrupos = Math.min(canchas, zs.reduce(function(s,z){return s+Math.floor(z/2);},0));
  var turnosG = Math.ceil(grupos / porTurnoGrupos);
  var turnosPO = Q>=8 ? Math.ceil(4/canchas) + Math.ceil(2/canchas) + Math.ceil(2/canchas) : Q>=4 ? Math.ceil(2/canchas)+Math.ceil(2/canchas) : Q>=2 ? 1 : 0;
  var turnos = turnosG + turnosPO;
  var min = Math.min.apply(null, zs) - 1;
  return {zonas:zs, partidos:grupos+po, turnos:turnos, minutos:turnos*(+cfg('minutosTurno')||25), minPorEquipo:min};
}
function hm(min){ return Math.floor(min/60)+'h '+('0'+min%60).slice(-2); }
